#secret (person-service) example
apiVersion: v1
kind: Secret
metadata:
  name: person-service
  namespace: {{ .Values.namespace }}
  labels:
    app: person-service
type: Opaque
data:
  # create bas64 encoded values. e.g. echo -n 'my-secret-password' | base64
  trocks.apiKey: "YjcwaXVuYVRZRmJ2OSM="
  db.password: "TWlja1lNMHVfMw=="
  db.username: "dHJvY2tz"
