# This service account is used for two different purposes. 
# 1. Service account for gateway service to access kubernetes API for service discovery
# 2. Default service account for all pods in the namespace to allow access to AWS resources via pod identity association
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount }}
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-discovery-role
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "namespaces", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-discovery-binding
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount }} # Must match the ServiceAccount name above
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: gateway-discovery-role # Must match the Role name above
  apiGroup: rbac.authorization.k8s.io
