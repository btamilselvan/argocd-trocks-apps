#configmap (person-service) example
apiVersion: v1
kind: ConfigMap
metadata:
  name: person-service
  namespace: {{ .Values.namespace }}
data:
  # Common properties for all profiles
  application.yml: |
    # server:
    #   port: 8080
    greeting:
      message: "Hello from person-service configmap in Kubernetes. Default profile."
    hello:
      message: "Hello from person-service in Kubernetes using default profile!"
---
#configmap (person-service) example
apiVersion: v1
kind: ConfigMap
metadata:
  name: person-service-dev
  namespace: {{ .Values.namespace }}
data:
  # Profile-specific overrides
  person-service-dev.yml: |
    hello:
      message: "Hello from person-service configmap in Kubernetes. Hello from the dev profile."
---
## configmap (address-service) example
apiVersion: v1
kind: ConfigMap
metadata:
  name: address-service
  namespace: {{ .Values.namespace }}
data:
  sample.message: "Hello from address-service in Kubernetes!"
  #another way will be to use the application.yaml to map config values to env variables
  address-service.yml: |
    greeting:
      message: "Hello from address-service configmap in Kubernetes!"
    hello:
      message: "Hello from address-service in Kubernetes using default profile!"